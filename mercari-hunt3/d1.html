<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Hunt List — for the Ferrucho family</title>
<link rel="stylesheet" href="base.css">
<style>
body{background:var(--bg)}
.app{max-width:560px;margin:0 auto;background:#fff;min-height:100vh;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;background:#fff;padding:10px 12px 0}
.search{display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:999px;background:#f2f2f2;color:var(--sub);font-size:15px}
.search svg{width:18px;height:18px;flex:none;fill:none;stroke:#666;stroke-width:2}
.chips{display:flex;gap:8px;padding:12px 0;flex-wrap:wrap}
.tab{height:36px;padding:0 16px;border-radius:999px;background:#f2f2f2;font-size:14px;white-space:nowrap}
.tab.on{background:#fff;box-shadow:inset 0 0 0 2px var(--ink);font-weight:700}
.sortrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 0 10px;font-size:14px;color:var(--ink)}
.check{display:flex;white-space:nowrap;align-items:center;gap:8px}
.check i{width:20px;height:20px;border:2px solid #999;border-radius:4px}
.sortrow small{color:var(--sub);font-size:13px}
.hero{padding:16px 12px 6px}
.hero h1{font-size:24px;line-height:1.25;letter-spacing:-.01em}
.hero .for{font-size:13px;color:var(--sub);margin-top:2px}
.hero p{margin-top:10px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.cell{display:block;min-width:0}
.ph{position:relative;aspect-ratio:1;background:#eee;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.cell h3{font-size:13px;font-weight:700;line-height:1.4;padding:6px 6px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cell p{font-size:12px;color:var(--sub);padding:2px 6px 12px;line-height:1.4}
@media (max-width:359px){.pill{font-size:13px;padding-right:8px}.heart,.heart svg{width:26px;height:26px}}
.save{padding:8px 12px 16px}
.save .btn-red{border-radius:12px;box-shadow:0 4px 12px rgba(255,2,17,.25)}
.sec{border-top:8px solid var(--bg);padding:20px 12px}
.sec h2{font-size:17px;margin-bottom:14px}
.fee{display:flex;gap:10px;align-items:flex-start;background:#fff5f5;border-radius:8px;padding:12px;font-size:14px;margin-top:18px}
.fee b{flex:none;color:var(--red);font-size:13px;border:1px solid var(--red);border-radius:4px;padding:0 6px;line-height:20px;margin-top:1px}
.honest{font-size:14px}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar a{display:grid;justify-items:center;gap:2px;padding:8px 0 6px;font-size:12px;color:#555}
.tabbar svg{width:24px;height:24px;fill:none;stroke:#333;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.tabbar a.on{color:var(--ink);font-weight:700}
.tabbar a.on svg{fill:#333}
</style>
</head>
<body>
<div class="app" id="top">
  <div class="top">
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Nicholas's hunt list</div>
    <div class="chips" id="tabs"></div>
    <div class="sortrow"><span class="check"><i></i>On sale only</span><small id="count"></small></div>
  </div>

  <section class="hero">
    <h1>The Hunt List</h1>
    <p class="for">For the Ferrucho family · Ikebukuro tour, Dec 20</p>
    <p data-slot="intro"></p>
  </section>

  <div class="grid" id="items"></div>
  <div class="save"><a class="btn-red" href="#ask"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2"><path d="M12 20.3s-7.6-4.6-9.3-9.2C1.6 8 3.4 4.6 6.8 4.3c2.1-.2 3.9 1 5.2 2.8 1.3-1.8 3.1-3 5.2-2.8 3.4.3 5.2 3.7 4.1 6.8-1.7 4.6-9.3 9.2-9.3 9.2z"/></svg>Send the hunt list</a></div>

  <section class="sec" id="how">
    <h2>How it works</h2>
    <div data-slot="steps"></div>
    <p class="fee"><b>FREE</b><span data-slot="fee"></span></p>
  </section>

  <section class="sec" id="honest">
    <h2>The honest part</h2>
    <div data-slot="honest"></div>
  </section>

  <section class="sec" id="ask">
    <h2>Send the hunt list</h2>
    <div data-slot="form"></div>
  </section>
</div>

<div class="tabbar"><nav>
  <a href="#top" class="on"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>Home</a>
  <a href="#items"><svg viewBox="0 0 24 24"><path d="M12 20.3s-7.6-4.6-9.3-9.2C1.6 8 3.4 4.6 6.8 4.3c2.1-.2 3.9 1 5.2 2.8 1.3-1.8 3.1-3 5.2-2.8 3.4.3 5.2 3.7 4.1 6.8-1.7 4.6-9.3 9.2-9.3 9.2z"/></svg>Items</a>
  <a href="#how"><svg viewBox="0 0 24 24"><path d="M5 5h14M5 12h14M5 19h9"/></svg>How</a>
  <a href="#honest"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v6M12 7.5v.5"/></svg>Honest</a>
  <a href="#ask"><svg viewBox="0 0 24 24"><path d="M4 6h16v11H8l-4 3z"/></svg>Ask</a>
</nav></div>

<script src="hunt.js"></script>
<script>
huntCommon();
huntTabs(document.getElementById('tabs'), list => {
  document.getElementById('count').textContent = list.length + ' items · Nov 19, 2026';
  document.getElementById('items').innerHTML = list.map(it => `
    <a class="cell" href="${it.url}" target="_blank" rel="noopener">
      <div class="ph"><img src="${it.img}" alt="${it.alt}" loading="lazy">
        <span class="pill">${it.price}</span><span class="heart">${HEART}</span></div>
      <h3>${it.name}</h3>
      <p>${it.range}</p>
    </a>`).join('');
});
</script>
</body>
</html>
