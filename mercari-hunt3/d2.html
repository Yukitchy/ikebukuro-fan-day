<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Hunt List — for the Ferrucho family</title>
<link rel="stylesheet" href="base.css">
<style>
body{background:var(--bg)}
.app{max-width:560px;margin:0 auto;background:#fff;min-height:100vh}
.nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.nav .bar{display:flex;align-items:center;height:48px;padding:0 12px;gap:8px}
.nav .bar svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2}
.nav .bar strong{flex:1;text-align:center;font-size:16px;margin-right:30px}
#tabs{display:grid;grid-template-columns:repeat(3,1fr)}
.tab{height:42px;font-size:14px;color:var(--sub);border-bottom:2px solid transparent}
.tab.on{color:var(--ink);font-weight:700;border-color:var(--ink)}
.hero{padding:20px 16px;border-bottom:8px solid var(--bg)}
.hero h1{font-size:24px;line-height:1.25}
.hero .for{font-size:13px;color:var(--sub);margin-top:2px}
.hero p{margin-top:10px}
.item{border-bottom:8px solid var(--bg)}
.photo{position:relative;aspect-ratio:1;background:#111}
.photo img{width:100%;height:100%;object-fit:contain}
.photo .count{position:absolute;right:12px;bottom:12px;background:var(--pill);color:#fff;font-size:12px;border-radius:999px;padding:2px 10px}
.body{padding:16px}
.body h2{font-size:18px;line-height:1.35}
.body .subt{font-size:14px;color:var(--sub);margin-top:2px}
.meta{display:flex;align-items:center;gap:16px;margin-top:10px;color:var(--sub);font-size:13px}
.meta span{display:flex;align-items:center;gap:4px}
.meta svg{width:20px;height:20px;fill:none;stroke:#666;stroke-width:1.8}
.price{display:flex;align-items:baseline;gap:6px;margin-top:12px;color:var(--red)}
.price b{font-size:30px;letter-spacing:-.01em;line-height:1.1}
.price small{font-size:12px;color:var(--sub)}
.btns{display:grid;gap:10px;margin-top:16px}
.btns .btn-red{min-height:50px}
.spec{margin-top:20px}
.spec h4{font-size:15px;margin-bottom:6px}
.spec dl{display:grid;grid-template-columns:auto 1fr;font-size:14px}
.spec dt,.spec dd{padding:10px 0;border-top:1px solid var(--line)}
.spec dt{color:var(--sub);padding-right:16px;white-space:nowrap}
.sec{padding:24px 16px;border-bottom:8px solid var(--bg)}
.sec h2{font-size:17px;margin-bottom:14px}
.fee{margin-top:18px;padding:12px;border-radius:8px;background:var(--bg);font-size:14px}
.fee strong{color:var(--red)}
.honest{font-size:14px}
</style>
</head>
<body>
<div class="app">
  <div class="nav">
    <div class="bar"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><strong>The Hunt List</strong></div>
    <div id="tabs"></div>
  </div>

  <section class="hero">
    <h1>The Hunt List</h1>
    <p class="for">For the Ferrucho family · Ikebukuro tour, Dec 20</p>
    <p data-slot="intro"></p>
  </section>

  <div id="items"></div>

  <section class="sec" id="how">
    <h2>How it works</h2>
    <div data-slot="steps"></div>
    <p class="fee"><span data-slot="fee"></span></p>
  </section>
  <section class="sec">
    <h2>The honest part</h2>
    <div data-slot="honest"></div>
  </section>
  <section class="sec" id="ask">
    <h2>Send the hunt list</h2>
    <div data-slot="form"></div>
  </section>
</div>

<script src="hunt.js"></script>
<script>
huntCommon();
huntTabs(document.getElementById('tabs'), list => {
  document.getElementById('items').innerHTML = list.map(it => `
    <article class="item">
      <div class="photo"><img src="${it.img}" alt="${it.alt}" loading="lazy"><span class="count">1/1</span></div>
      <div class="body">
        <h2>${it.title}</h2>
        <p class="subt">${it.sub}</p>
        <div class="meta"><span>${HEART} Like</span><span>${it.cat}</span></div>
        <p class="price"><b>${it.price}</b><small>example listing</small></p>
        <div class="btns">
          <button class="btn-red" type="button" onclick="huntAsk('${it.id}')">Ask Yuuki to buy</button>
          <a class="btn-line" href="${it.url}" target="_blank" rel="noopener">See it on Mercari</a>
        </div>
        <div class="spec"><h4>Item details</h4><dl>
          <dt>Market range</dt><dd>${it.range}</dd>
          <dt>Category</dt><dd>${it.cat}</dd>
          <dt>Checked</dt><dd>Nov 19, 2026</dd>
        </dl></div>
      </div>
    </article>`).join('');
});
</script>
</body>
</html>
