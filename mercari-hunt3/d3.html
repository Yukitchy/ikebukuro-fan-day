<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Hunt List — for the Ferrucho family</title>
<link rel="stylesheet" href="base.css">
<style>
body{background:var(--bg)}
.app{max-width:560px;margin:0 auto;background:#fff;min-height:100vh}
.nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.nav .bar{display:flex;align-items:center;height:48px;padding:0 12px}
.nav .bar svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2}
.nav .bar strong{flex:1;text-align:center;font-size:16px;margin-right:22px}
#tabs{display:grid;grid-template-columns:repeat(3,1fr)}
.tab{height:42px;font-size:14px;color:var(--sub);border-bottom:2px solid transparent}
.tab.on{color:var(--ink);font-weight:700;border-color:var(--red)}
.hero{padding:20px 16px;border-bottom:8px solid var(--bg)}
.hero h1{font-size:24px;line-height:1.25}
.hero .for{font-size:13px;color:var(--sub);margin-top:2px}
.hero p{margin-top:10px}
.label{padding:12px 16px;font-size:13px;color:var(--sub);background:var(--bg)}
.row{display:grid;grid-template-columns:96px 1fr 32px;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);align-items:start}
.thumb{position:relative;width:96px;height:96px;border-radius:4px;overflow:hidden;background:#eee}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb .sold{position:absolute;left:0;top:0}
.row h3{font-size:14px;font-weight:400;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .r{font-size:12px;color:var(--sub);margin-top:4px;line-height:1.4}
.row .p{font-size:17px;font-weight:700;margin-top:6px}
.like{display:grid;justify-items:center;font-size:12px;color:var(--red);gap:0}
.like svg{width:26px;height:26px;fill:var(--red)}
.cta{padding:16px;border-bottom:8px solid var(--bg)}
.list h2,.sec h2{font-size:17px}
.sec{padding:24px 16px;border-bottom:8px solid var(--bg)}
.sec h2{margin-bottom:14px}
.steps{gap:0}
.steps li{padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.steps li:last-child{border-bottom:0}
.steps b{background:var(--red)}
.steps span{padding-top:0}
.fee{margin-top:8px;padding:12px;border-radius:8px;background:var(--bg);font-size:14px}
.honest{font-size:14px}
</style>
</head>
<body>
<div class="app">
  <div class="nav">
    <div class="bar"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><strong>Likes</strong></div>
    <div id="tabs"></div>
  </div>
  <section class="hero">
    <h1>The Hunt List</h1>
    <p class="for">For the Ferrucho family · Ikebukuro tour, Dec 20</p>
    <p data-slot="intro"></p>
  </section>
  <p class="label" id="count"></p>
  <div id="items"></div>
  <div class="cta"><a class="btn-red" href="#ask">Send the hunt list</a></div>

  <section class="sec" id="how">
    <h2>How it works</h2>
    <div data-slot="steps"></div>
    <p class="fee" data-slot="fee"></p>
  </section>
  <section class="sec">
    <h2>The honest part</h2>
    <div data-slot="honest"></div>
  </section>
  <section class="sec" id="ask">
    <h2>Send the hunt list</h2>
    <div data-slot="form"></div>
  </section>
</div>

<script src="hunt.js"></script>
<script>
huntCommon();
huntTabs(document.getElementById('tabs'), (list, cat) => {
  document.getElementById('count').textContent = list.length + ' items you might like · ' + cat + ' · prices as of Nov 19, 2026';
  document.getElementById('items').innerHTML = list.map(it => `
    <a class="row" href="${it.url}" target="_blank" rel="noopener">
      <div class="thumb"><img src="${it.img}" alt="" loading="lazy"></div>
      <div><h3>${it.name}</h3><p class="r">${it.range}</p><p class="p">${it.price}</p></div>
      <span class="like">${HEART}</span>
    </a>`).join('');
});
</script>
</body>
</html>
