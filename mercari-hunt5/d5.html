<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Hunt List — for the Ferrucho family</title>
<link rel="stylesheet" href="base.css">
<style>
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.top .bar{display:flex;align-items:center;height:46px;padding:0 12px}
.top .bar svg{width:22px;height:22px;fill:none;stroke:var(--black);stroke-width:2;stroke-linecap:round}
.top .bar strong{flex:1;text-align:center;font-size:16px;color:var(--black);margin-right:22px}
.top .s{padding:0 12px}
.top .chips{padding:10px 12px}
.intro{padding:16px 16px 4px;font-size:14px}
.intro h1{font-size:20px;color:var(--black)}
.intro .for{font-size:12px;color:var(--sub);margin-bottom:6px}
.rows{list-style:none;padding-bottom:12px}
.row{display:grid;grid-template-columns:88px minmax(0,1fr) 32px;gap:12px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--line);align-items:start}
.row .th{position:relative;display:block;width:88px;height:88px;border-radius:4px;overflow:hidden;background:#eee}
.row .th img{width:100%;height:100%;object-fit:cover}
.row h3{font-size:14px;font-weight:400;color:var(--black);line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .p{font-size:18px;font-weight:700;color:var(--black);margin-top:4px;font-variant-numeric:tabular-nums}
.row .r{font-size:12px;color:var(--sub);line-height:1.35;margin-top:2px}
.row .ask{margin-top:8px;font-size:13px;font-weight:700;color:var(--red)}
.row .heart{position:static;width:32px;height:32px}
.row .heart svg{width:26px;height:26px;margin:3px;fill:none;stroke:var(--sub);stroke-width:1.7}
.row .heart.liked svg{fill:var(--red);stroke:var(--red)}

/* ---- d5 today's hunt ---- */

.spot{margin:0 12px 8px;border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px var(--line),0 12px 28px -12px rgba(0,0,0,.22)}
.spot .ph{position:relative;display:block;aspect-ratio:1;background:#f2f2f2}
.spot .fill{display:block;height:100%}
.spot .ph img{width:100%;height:100%;object-fit:cover;animation:in .6s cubic-bezier(.2,.7,.2,1)}
@keyframes in{from{transform:scale(1.04);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.spot .fill{display:block;height:100%}
.spot .ph img{animation:none}}
.spot .lab{position:absolute;left:12px;top:12px;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:999px;background:var(--red);color:#fff;font-size:13px;font-weight:700;box-shadow:0 2px 8px rgba(255,2,17,.3)}
.spot .lab::before{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
.spot .heart{top:10px;right:10px;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.spot .heart svg{width:24px;height:24px;fill:none;stroke:var(--sub);stroke-width:1.7}
.spot .heart.liked svg{fill:var(--red);stroke:var(--red)}
.spot .body{padding:14px 16px 16px}
.spot h3{font-size:18px;font-weight:700;color:var(--black);line-height:1.3}
.spot .sub{font-size:13px;color:var(--sub);margin-top:2px}
.spot .p{font-size:32px;font-weight:800;letter-spacing:-.02em;color:var(--black);margin-top:8px;line-height:1.1;font-variant-numeric:tabular-nums}
.spot .r{font-size:13px;color:var(--sub);margin-top:4px}
.spot .btn-red{margin-top:14px}
.more{font-size:14px;font-weight:700;color:var(--sub);padding:16px 12px 4px 16px;border-bottom:1px solid var(--line)}

</style>
</head>
<body>
<div class="app" id="top">
  <div class="top">
    <div class="bar"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><strong>Likes</strong></div>
    <div class="s"><div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3"/></svg>Search Mercari items</div></div>
    <div class="chips" id="tabs"></div>
  </div>
  <div class="intro"><h1>The Hunt List</h1><p class="for">For the Ferrucho family · Ikebukuro tour, Dec&nbsp;20</p><p data-slot="intro"></p></div>
  <h2 class="apphead" id="items">Liked for Nicholas</h2>
  <article class="spot" id="spot"></article>
  <h3 class="more" id="more"></h3>
  <ul class="rows" id="rows"></ul>

  <section class="sec" id="how"><h2>How it works</h2><div data-slot="steps"></div><p class="fee" data-slot="fee"></p></section>
  <section class="sec" id="honest"><h2>The honest part</h2><div data-slot="honest"></div><div data-slot="sold"></div></section>
  <section class="sec" id="ask"><h2>Send the hunt list</h2><div data-slot="form"></div></section>
</div>
<script src="hunt.js"></script>
<script>
huntCommon(); huntSoldDemo(); huntTabbar();
const link = (it, inner, cls = '') => `<a class="${cls}" href="${it.url}" target="_blank" rel="noopener">${inner}</a>`;
const heart = (extra = '') => `<span class="heart liked${extra}" role="button" aria-label="Like" aria-pressed="true">${HEART}</span>`;
const row = (it, thumbExtra = '', below = '', price = it.price) => `
    <li class="row">
      ${link(it, `<img src="${it.img}" alt="${it.alt}" loading="lazy">${thumbExtra}`, 'th')}
      <div>
        ${link(it, `<h3>${it.name}</h3>`)}
        ${below}<p class="p">${price}</p>
        <p class="r">${it.range}</p>
        <button class="ask" type="button" onclick="huntAsk('${it.id}')">Ask Yuuki to buy</button>
      </div>
      ${heart()}
    </li>`;

huntTabs(document.getElementById('tabs'), (list, cat) => {
  const [top, ...rest] = list;
  document.getElementById('spot').innerHTML = `
    <div class="ph">${link(top, `<img src="${top.img}" alt="${top.alt}">`, 'fill')}
      <span class="lab">Today's hunt · ${cat}</span>${heart()}</div>
    <div class="body">
      ${link(top, `<h3>${top.title}</h3><p class="sub">${top.sub}</p>`)}
      <p class="p">${top.price}</p>
      <p class="r">${top.range}</p>
      <button class="btn-red" type="button" onclick="huntAsk('${top.id}')">Ask Yuuki to buy</button>
    </div>`;
  document.getElementById('more').textContent = 'More in ' + cat;
  document.getElementById('rows').innerHTML = rest.map(it => row(it)).join('');
});

</script>
</body>
</html>
