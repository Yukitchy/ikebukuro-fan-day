<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Hunt List — for the Ferrucho family</title>
<link rel="stylesheet" href="base.css">
<style>
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px 12px 0}
.top .chips{padding:10px 0}
.hero{padding:18px 16px 20px}
.hero h1{font-size:22px;color:var(--black);line-height:1.25}
.hero .for{font-size:13px;color:var(--sub);margin:2px 0 10px}
.hero p{font-size:14px}
.item{border-top:8px solid var(--bg)}
.photo{position:relative;aspect-ratio:1;background:#111}
.photo img{width:100%;height:100%;object-fit:contain}
.photo .count{position:absolute;right:12px;bottom:12px;background:var(--pill);color:#fff;font-size:12px;border-radius:999px;padding:2px 10px}
.body{padding:14px 16px 20px}
.body h2{font-size:18px;line-height:1.35;color:var(--black);font-weight:700}
.body .subt{font-size:14px;color:var(--sub);margin-top:2px}
.price{display:flex;align-items:baseline;gap:6px;margin-top:12px;color:var(--black)}
.price b{font-size:30px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.price b small{font-size:20px;margin-right:1px}
.price span{font-size:12px;color:var(--sub)}
.acts{display:flex;gap:20px;margin-top:10px;font-size:12px;color:var(--sub)}
.acts span{display:flex;align-items:center;gap:4px}
.acts .heart{position:static;width:auto;height:auto;display:flex;align-items:center;gap:4px}
.acts .heart svg{width:22px;height:22px;fill:none;stroke:var(--sub);stroke-width:1.7}
.acts .heart.liked svg{fill:var(--red);stroke:var(--red)}
.acts svg{width:22px;height:22px;fill:none;stroke:var(--sub);stroke-width:1.7}
.btns{display:grid;gap:10px;margin-top:16px}
.btns .btn-red{min-height:50px;border-radius:6px}
.btns .btn-line{border-radius:6px}
.spec h4{font-size:15px;font-weight:700;color:var(--black);margin:22px 0 4px}
.spec dl{display:grid;grid-template-columns:auto 1fr;font-size:14px}
.spec dt,.spec dd{padding:11px 0;border-bottom:1px solid var(--line)}
.spec dt{color:var(--sub);padding-right:16px;white-space:nowrap}
</style>
</head>
<body>
<div class="app" id="top">
  <div class="top"><div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3"/></svg>Search Mercari items</div><div class="chips" id="tabs"></div></div>
  <section class="hero"><h1>The Hunt List</h1><p class="for">For the Ferrucho family · Ikebukuro tour, Dec&nbsp;20</p><p data-slot="intro"></p></section>
  <div id="items"></div>

  <section class="sec" id="how"><h2>How it works</h2><div data-slot="steps"></div><p class="fee" data-slot="fee"></p></section>
  <section class="sec" id="honest"><h2>The honest part</h2><div data-slot="honest"></div><div data-slot="sold"></div></section>
  <section class="sec" id="ask"><h2>Send the hunt list</h2><div data-slot="form"></div></section>
</div>
<script src="hunt.js"></script>
<script>
huntCommon(); huntSoldDemo(); huntTabbar();
huntTabs(document.getElementById('tabs'), list => {
  document.getElementById('items').innerHTML = list.map(it => `
    <article class="item">
      <div class="photo"><img src="${it.img}" alt="${it.alt}" loading="lazy"><span class="count">1/1</span></div>
      <div class="body">
        <h2>${it.title}</h2>
        <p class="subt">${it.sub}</p>
        <p class="price"><b><small>¥</small>${it.ex.toLocaleString('en-US')}</b><span>example listing + shipping</span></p>
        <div class="acts"><span class="heart" role="button" aria-label="Like" aria-pressed="false">${HEART}Like</span><span><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>Ask</span></div>
        <div class="btns">
          <button class="btn-red" type="button" onclick="huntAsk('${it.id}')">Ask Yuuki to buy</button>
          <a class="btn-line" href="${it.url}" target="_blank" rel="noopener">See it on Mercari</a>
        </div>
        <div class="spec"><h4>Item details</h4><dl>
          <dt>Market range</dt><dd>${it.range}</dd>
          <dt>Category</dt><dd>${it.cat}</dd>
          <dt>Shipping</dt><dd>Domestic, usually ¥200–700</dd>
          <dt>Checked</dt><dd>Nov 19, 2026</dd>
        </dl></div>
      </div>
    </article>`).join('');
});
</script>
</body>
</html>
