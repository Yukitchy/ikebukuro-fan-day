<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Hunt List — for the Ferrucho family</title>
<link rel="stylesheet" href="base.css">
<style>
.top{position:sticky;top:0;z-index:5;background:#fff;padding:10px 12px;border-bottom:1px solid var(--line)}
.cover{height:96px;display:grid;grid-template-columns:repeat(3,1fr);overflow:hidden}
.cover img{width:100%;height:100%;object-fit:cover;filter:saturate(.9) brightness(.85)}
.shop{padding:0 16px 16px;border-bottom:1px solid var(--line)}
.shop .av{position:relative;width:64px;height:64px;margin-top:-32px;border-radius:50%;border:3px solid #fff;background:var(--black);color:#fff;display:grid;place-items:center;font-weight:800;font-size:24px}
.shop h1{font-size:19px;color:var(--black);margin-top:8px}
.shop .meta{font-size:12px;color:var(--sub);margin-top:2px}
.shop .meta b{color:var(--black)}
.shop p{font-size:14px;margin-top:10px}
.camp{margin:14px 12px 4px;padding:14px 16px;border-radius:8px;background:var(--red);color:#fff;display:flex;gap:14px;align-items:center}
.camp b{flex:none;font-size:30px;line-height:1;font-weight:800}
.camp b small{display:block;font-size:11px;font-weight:700;letter-spacing:.04em;margin-top:3px}
.camp p{font-size:13px;line-height:1.45}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding-bottom:18px}
.cell{position:relative;aspect-ratio:1;overflow:hidden;background:#eee}
.cell img{width:100%;height:100%;object-fit:cover}
.cell .pill{font-size:13px;bottom:6px}
.cell .heart{width:26px;height:26px;top:4px;right:4px}
.cell .heart svg{width:26px;height:26px}
.list{padding:0 12px 18px;font-size:13px}
.list a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list b{color:var(--black)}
.list small{display:block;color:var(--sub)}
.list i{font-style:normal;font-weight:700;color:var(--black);align-self:center}
</style>
</head>
<body>
<div class="app" id="top">
  <div class="top"><div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3"/></svg>Search Mercari items</div></div>
  <div class="cover"><img src="img/m36425879874.jpg" alt=""><img src="img/m25932299194.jpg" alt=""><img src="img/m75254338953.jpg" alt=""></div>
  <div class="shop">
    <div class="av">Y</div>
    <h1>Yuuki's Hunt Shop</h1>
    <p class="meta">For the Ferrucho family · <b>Ikebukuro, Dec&nbsp;20</b></p>
    <p data-slot="intro"></p>
  </div>
  <div class="camp"><b>¥0<small>SERVICE FEE</small></b><p data-slot="fee"></p></div>
  <div class="chips" id="tabs"></div>
  <h2 class="apphead" id="items" style="padding-top:4px">The Hunt List</h2>
  <div class="grid" id="grid"></div>
  <div class="list" id="list"></div>

  <section class="sec" id="how"><h2>How it works</h2><div data-slot="steps"></div><p class="fee" data-slot="fee"></p></section>
  <section class="sec" id="honest"><h2>The honest part</h2><div data-slot="honest"></div><div data-slot="sold"></div></section>
  <section class="sec" id="ask"><h2>Send the hunt list</h2><div data-slot="form"></div></section>
</div>
<script src="hunt.js"></script>
<script>
huntCommon(); huntSoldDemo(); huntTabbar();
huntTabs(document.getElementById('tabs'), list => {
  document.getElementById('grid').innerHTML = list.map(it => `
    <a class="cell" href="${it.url}" target="_blank" rel="noopener"><img src="${it.img}" alt="${it.alt}" loading="lazy"><span class="pill">${it.price}</span><span class="heart" role="button" aria-label="Like" aria-pressed="false">${HEART}</span></a>`).join('');
  document.getElementById('list').innerHTML = list.map(it => `
    <a href="${it.url}" target="_blank" rel="noopener"><span><b>${it.name}</b><small>${it.range}</small></span><i>${it.price}</i></a>`).join('');
});
</script>
</body>
</html>
