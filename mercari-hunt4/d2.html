<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Hunt List — for the Ferrucho family</title>
<link rel="stylesheet" href="base.css">
<style>
.top{position:sticky;top:0;z-index:5;background:#fff;padding:10px 12px 0}
.top .bar{display:flex;align-items:center;gap:10px}
.top .bar>svg{flex:none;width:22px;height:22px;fill:none;stroke:var(--black);stroke-width:2;stroke-linecap:round}
.top .search{flex:1;min-width:0}
.top .chips{padding:10px 0}
.intro{padding:6px 12px 14px;font-size:14px;border-bottom:1px solid var(--line)}
.intro h1{font-size:18px;color:var(--black)}
.intro .for{font-size:12px;color:var(--sub);margin-bottom:6px}
.sort{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;font-size:13px;color:var(--ink)}
.sort span{display:flex;align-items:center;gap:4px}
.sort svg{width:16px;height:16px;fill:none;stroke:var(--ink);stroke-width:1.8;stroke-linecap:round}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 3px;padding-bottom:18px}
.cell .ph{position:relative;aspect-ratio:1;overflow:hidden;background:#eee}
.cell img{width:100%;height:100%;object-fit:cover}
.cell .pill{font-size:14px;bottom:6px}
.cell .heart{width:28px;height:28px;top:4px;right:4px}
.cell .heart svg{width:28px;height:28px}
.cell .cell-title{padding:5px 6px 0;font-weight:700;font-size:12.5px}
.ranges{padding:0 12px 20px;font-size:13px}
.ranges div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.ranges div span:last-child{color:var(--sub)}
</style>
</head>
<body>
<div class="app" id="top">
  <div class="top">
    <div class="bar"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg><div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3"/></svg>Search Mercari items</div></div>
    <div class="chips" id="tabs"></div>
  </div>
  <div class="intro"><h1>The Hunt List</h1><p class="for">For the Ferrucho family · Ikebukuro tour, Dec&nbsp;20</p><p data-slot="intro"></p></div>
  <div class="sort" id="items"><span id="count"></span><span><svg viewBox="0 0 24 24"><path d="M7 4v16M3.5 16.5L7 20l3.5-3.5M17 20V4M13.5 7.5L17 4l3.5 3.5"/></svg>Recommended</span></div>
  <div class="grid" id="grid"></div>
  <h2 class="apphead">Market range</h2>
  <div class="ranges" id="ranges"></div>

  <section class="sec" id="how"><h2>How it works</h2><div data-slot="steps"></div><p class="fee" data-slot="fee"></p></section>
  <section class="sec" id="honest"><h2>The honest part</h2><div data-slot="honest"></div><div data-slot="sold"></div></section>
  <section class="sec" id="ask"><h2>Send the hunt list</h2><div data-slot="form"></div></section>
</div>
<script src="hunt.js"></script>
<script>
huntCommon(); huntSoldDemo(); huntTabbar();
huntTabs(document.getElementById('tabs'), list => {
  document.getElementById('count').textContent = list.length + ' items';
  document.getElementById('grid').innerHTML = list.map(it => `
    <a class="cell" href="${it.url}" target="_blank" rel="noopener">
      <div class="ph"><img src="${it.img}" alt="${it.alt}" loading="lazy"><span class="pill">${it.price}</span><span class="heart" role="button" aria-label="Like" aria-pressed="false">${HEART}</span></div>
      <h3 class="cell-title">${it.name}</h3>
    </a>`).join('');
  document.getElementById('ranges').innerHTML = list.map(it => `<div><span>${it.title}</span><span>${it.range}</span></div>`).join('');
});
</script>
</body>
</html>
